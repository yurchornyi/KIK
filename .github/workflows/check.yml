name: Overlay checks
# Runs on the owner's Mac (self-hosted runner kik-mac): GitHub-hosted runners do
# not start for this private repository. A push to main is checked by deploy.yml,
# which calls this workflow before it deploys.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: [self-hosted, kik-mac]
    timeout-minutes: 30
    steps:
      # On power the Mac sleeps after a minute, and a sleeping runner loses
      # GitHub mid-job. caffeinate holds it awake while the job runs.
      - name: Keep the Mac awake
        run: nohup caffeinate -ims >/dev/null 2>&1 &
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34
      - run: python3 -m py_compile scripts/*.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloudflare/worker.test.mjs
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - name: Admin and settings integration with local D1
        run: |
          npm exec --prefix web -- wrangler d1 migrations apply kik-data --local --config web/wrangler.jsonc
          npm exec --prefix web -- wrangler dev --config web/wrangler.test.jsonc --port 8791 > $RUNNER_TEMP/kik-web.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8791/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat $RUNNER_TEMP/kik-web.log; exit 1; fi
          node web/management-integration.mjs
          node web/security-integration.mjs
      - name: Update security policy
        run: |
          mkdir -p $RUNNER_TEMP/kik-checks
          javac -d $RUNNER_TEMP/kik-checks localization/java/kik/i18n/UpdatePolicy.java scripts/UpdatePolicyCheck.java
          java -cp $RUNNER_TEMP/kik-checks UpdatePolicyCheck
      - name: TV pairing QR encoder
        run: |
          mkdir -p $RUNNER_TEMP/kik-qr
          javac -encoding UTF-8 -d $RUNNER_TEMP/kik-qr localization/java/kik/i18n/QrCode.java scripts/QrCheck.java
          java -cp $RUNNER_TEMP/kik-qr QrCheck
      - name: Playback recovery policy
        run: |
          javac -d $RUNNER_TEMP/kik-checks localization/java/kik/i18n/RecoveryPolicy.java scripts/RecoveryPolicyCheck.java
          java -cp $RUNNER_TEMP/kik-checks RecoveryPolicyCheck
      - name: DNS-over-HTTPS bypass policy
        run: |
          mkdir -p $RUNNER_TEMP/kik-doh
          javac -d $RUNNER_TEMP/kik-doh localization/java/kik/i18n/DohPolicy.java scripts/DohCheck.java
          java -cp $RUNNER_TEMP/kik-doh DohCheck
      - name: TV image memory and focus scrolling
        run: |
          mkdir -p $RUNNER_TEMP/kik-ui-checks
          javac -d $RUNNER_TEMP/kik-ui-checks localization/java/kik/i18n/ImageDecodePolicy.java scripts/ImageDecodeCheck.java localization/java/kik/i18n/FocusScrollPolicy.java scripts/FocusScrollCheck.java
          java -cp $RUNNER_TEMP/kik-ui-checks kik.i18n.ImageDecodeCheck
          java -cp $RUNNER_TEMP/kik-ui-checks kik.i18n.FocusScrollCheck
      - name: Android helpers compile with ExoPlayer
        run: |
          python3 scripts/localize.py --java-only
          javac -encoding UTF-8 -source 8 -target 8 -nowarn -cp "$ANDROID_HOME/platforms/android-34/android.jar:$(scripts/media3.sh)" -d $RUNNER_TEMP/kik-helpers localization/java/kik/i18n/*.java
      - name: Ensure no private build inputs are tracked
        run: |
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          bad=[n for n in names if n.startswith(('work/','backup/','decoded/','decompiled/','localized/','outputs/')) or n.endswith(('.apk','.jks','.keystore','.key','.pem'))]
          assert not bad,bad
          PY
