name: Overlay checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m py_compile scripts/*.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloudflare/worker.test.mjs
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - name: Admin and settings integration with local D1
        run: |
          npm exec --prefix web -- wrangler d1 migrations apply kik-data --local --config web/wrangler.jsonc
          npm exec --prefix web -- wrangler dev --config web/wrangler.test.jsonc --port 8791 > /tmp/kik-web.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8791/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/kik-web.log; exit 1; fi
          node web/management-integration.mjs
      - name: Update security policy
        run: |
          mkdir -p /tmp/kik-checks
          javac -d /tmp/kik-checks localization/java/kik/i18n/UpdatePolicy.java scripts/UpdatePolicyCheck.java
          java -cp /tmp/kik-checks UpdatePolicyCheck
      - name: Playback recovery policy
        run: |
          javac -d /tmp/kik-checks localization/java/kik/i18n/RecoveryPolicy.java scripts/RecoveryPolicyCheck.java
          java -cp /tmp/kik-checks RecoveryPolicyCheck
      - name: Ensure no private build inputs are tracked
        run: |
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          bad=[n for n in names if n.startswith(('work/','backup/','decoded/','decompiled/','localized/','outputs/')) or n.endswith(('.apk','.jks','.keystore','.key','.pem'))]
          assert not bad,bad
          PY
