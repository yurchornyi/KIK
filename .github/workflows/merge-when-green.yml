name: Merge when green

# Owner, 31.10: a PR goes in by itself once its checks pass, in all his projects. A private repository
# on GitHub Free has neither branch protection nor auto-merge, so .github/scripts/merge-when-green.mjs
# does it, at the commit the checks saw. Left alone: a draft, a bot's PR, a migration, a PR older than
# the script. Repository variable AUTO_MERGE=false switches it off.
on:
  check_run:
    types: [completed]
  # A draft made ready after its checks passed gets no new check_run, so this event merges it. A run of this
  # event belongs to the PR, so its token can write only for a PR from this repository (a fork's is read-only),
  # and the job runs no code from the PR: it fetches main's script. Its own check on the PR is ignored by name.
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  merge:
    name: Merge green pull requests
    if: >-
      vars.AUTO_MERGE != 'false' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'check_run' &&
         github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
         github.event.check_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # In the job, not the workflow: a skipped run does not join the group.
    concurrency:
      group: merge-when-green
      cancel-in-progress: false
    steps:
      # main's copy and no checkout: seconds, and it leaves the runner's workspace alone.
      - name: Merge every green pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW: release.yml
          RELEASE_PATHS: '^(?:localization/|scripts/(?:localize|simplify|branding)\.py$|scripts/(?:build|media3)\.sh$|web/kik-intro\.mp4$)'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/merge-when-green.mjs?ref=main" \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/merge-when-green.mjs"
          node "$RUNNER_TEMP/merge-when-green.mjs"
